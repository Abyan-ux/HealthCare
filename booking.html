<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book an Appointment - Hope Medical Center</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%2310b981' d='M0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256zm368.2-64.3c-20.9 0-38.3 12.1-46.2 29.5c-7.9-17.4-25.3-29.5-46.2-29.5c-27.3 0-49.4 22-49.4 49.3c0 42.4 43.1 82.2 87 114c4.6 3.3 10.1 5.1 15.7 5.1s11.1-1.8 15.7-5.1c43.8-31.8 87-71.6 87-114c0-27.3-22-49.3-49.4-49.3z'/></svg>">
    <style>
        :root {
            --primary-green: #10b981;
            --dark-green: #064e3b;
            --light-green: #ecfdf5;
            --mint-bg: #f0fdf4;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --white: #ffffff;
            --border-color: #e5e7eb;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 30px rgba(6, 78, 59, 0.08);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
        }

        body { 
            color: var(--text-main); 
            background: radial-gradient(circle at top right, var(--mint-bg) 0%, #f3f4f6 100%);
            min-height: 100vh; 
            display: none; 
            flex-direction: column; 
        }

        /* --- Header Navigation Bar --- */
        header { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow-sm); 
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(16, 185, 129, 0.1);
        }

        .navbar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 16px 24px; 
            position: relative;
        }

        .logo { 
            font-size: 24px; 
            font-weight: 800; 
            color: var(--dark-green); 
            text-decoration: none; 
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i { color: var(--primary-green); }

        .nav-menu { display: flex; align-items: center; gap: 30px; list-style: none; }
        .nav-item { text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 15px; transition: var(--transition); }
        .nav-item:hover, .nav-item.active { color: var(--primary-green); }
        .menu-toggle { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 4px; z-index: 1001; }
        .menu-toggle .bar { width: 25px; height: 3px; background-color: var(--dark-green); border-radius: 3px; transition: var(--transition); }

        .logout-btn { 
            background-color: transparent; border: 1.5px solid var(--primary-green); color: var(--primary-green); 
            padding: 8px 20px; border-radius: 30px; font-weight: 700; font-size: 14px; cursor: pointer; transition: var(--transition);
        }
        .logout-btn:hover { background-color: var(--primary-green); color: var(--white); }

        /* --- Main Layout Container --- */
        .container { flex: 1; max-width: 1200px; width: 100%; margin: 40px auto; padding: 0 24px; }
        .page-header { margin-bottom: 30px; text-align: center; }
        .page-header h1 { color: var(--dark-green); font-size: 28px; font-weight: 800; margin-bottom: 8px; }
        .page-header p { color: var(--text-muted); font-size: 16px; }

        /* --- Toast Notifications --- */
        #notificationToast {
            padding: 14px 20px; border-radius: 12px; margin-bottom: 24px; font-size: 14px; font-weight: 600;
            display: none; align-items: center; gap: 10px; animation: slideDown 0.3s ease;
        }
        #notificationToast.success { display: flex; background: #d1fae5; color: #065f46; border: 1px solid #10b981; }
        #notificationToast.error { display: flex; background: #fee2e2; color: #991b1b; border: 1px solid #ef4444; }

        @keyframes slideDown { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* --- Calendar Framework Layout --- */
        .calendar-year-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .month-card { background: var(--white); border-radius: 16px; padding: 20px; box-shadow: var(--shadow-md); border: 1px solid rgba(229, 231, 235, 0.6); }
        .month-title { color: var(--dark-green); font-size: 18px; font-weight: 700; margin-bottom: 15px; text-align: center; border-bottom: 2px solid var(--light-green); padding-bottom: 8px; }
        .weekdays-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: 700; font-size: 12px; color: #9ca3af; margin-bottom: 10px; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 6px; }
        
        .day-cell { padding: 10px 0; font-size: 14px; font-weight: 600; border-radius: 8px; color: #1f2937; transition: var(--transition); }
        .day-cell:not(.empty) { cursor: pointer; background-color: #f9fafb; border: 1px solid #f3f4f6; }
        .day-cell:not(.empty):hover { background-color: var(--primary-green); color: var(--white); border-color: var(--primary-green); transform: scale(1.05); }
        .day-cell.empty { background: transparent; }

        /* --- Modal Component Styles --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-box {
            background: var(--white); padding: 30px; border-radius: 20px;
            max-width: 550px; width: 100%; box-shadow: var(--shadow-md);
            max-height: 90vh; overflow-y: auto; position: relative;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; color: var(--dark-green); }
        .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); }

        /* Time Slots Grid Wrapper */
        .slots-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 10px; margin: 15px 0 20px 0; }
        .time-slot {
            padding: 10px; text-align: center; border-radius: 8px; font-size: 13px; font-weight: 700;
            border: 1px solid var(--border-color); cursor: pointer; transition: var(--transition); background: #fafafa;
        }
        .time-slot.available:hover { background: var(--light-green); color: var(--dark-green); border-color: var(--primary-green); }
        .time-slot.selected { background: var(--primary-green) !important; color: var(--white) !important; border-color: var(--primary-green) !important; }
        .time-slot.booked { background: #fee2e2; color: #ef4444; border-color: #fca5a5; cursor: not-allowed; opacity: 0.6; }

        /* Form Details Field */
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-label { font-size: 13px; font-weight: 700; color: var(--dark-green); margin-bottom: 6px; display: block; }
        .form-textarea {
            width: 100%; min-height: 80px; padding: 12px; border-radius: 10px; border: 1px solid var(--border-color);
            font-size: 14px; outline: none; resize: vertical; transition: var(--transition); color: var(--text-main);
        }
        .form-textarea:focus { border-color: var(--primary-green); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1); }

        .confirm-btn {
            width: 100%; background: var(--dark-green); color: var(--white); border: none;
            padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer;
            transition: var(--transition); display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .confirm-btn:hover { background: var(--primary-green); }
        .confirm-btn:disabled { background: #9ca3af; cursor: not-allowed; }

        /* --- Mobile Responsive Rules --- */
        @media (max-width: 768px) {
            .menu-toggle { display: flex; }
            .menu-toggle.open .bar:nth-child(1) { transform: translateY(8px) rotate(45deg); }
            .menu-toggle.open .bar:nth-child(2) { opacity: 0; }
            .menu-toggle.open .bar:nth-child(3) { transform: translateY(-8px) rotate(-445deg); }
            .nav-menu {
                position: absolute; top: 100%; left: 0; right: 0; background: var(--white);
                flex-direction: column; padding: 24px; gap: 20px; border-bottom: 1px solid var(--border-color);
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); transform: translateY(-20px);
                opacity: 0; visibility: hidden; transition: var(--transition);
            }
            .nav-menu.open { transform: translateY(0); opacity: 1; visibility: visible; }
            .logout-btn { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo"><i class="fa-solid fa-heart-pulse"></i> HopeMedical</a>
            <button class="menu-toggle" id="menuToggle"><span class="bar"></span><span class="bar"></span><span class="bar"></span></button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-item">Home</a></li>
                <li><a href="doctor.html" class="nav-item">Doctor Hub</a></li>
                <li><a href="user.html" class="nav-item">Profile</a></li>
                <li><a href="booking.html" class="nav-item active">Book Appointment</a></li>
                <li><button type="button" class="logout-btn" id="logoutBtn">Sign Out</button></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div id="notificationToast"></div>
        <div class="page-header">
            <h1>Select an Appointment Date</h1>
            <p>Click on any date to explore open 15-minute intervals between 08:00 and 20:00.</p>
        </div>
        <div class="calendar-year-grid" id="calendarYearGrid"></div>
    </main>

    <div class="modal-overlay" id="bookingModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalTargetDate">Select a Time Slot</h3>
                <button class="modal-close" id="modalCloseBtn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p style="font-size: 14px; color: var(--text-muted);">Available time slots are marked in light gray. Select your preferred slot:</p>
            
            <div class="slots-container" id="slotsGrid"></div>

            <div class="form-group">
                <label class="form-label" for="bookingDescription">Reason for Appointment / Medical Details</label>
                <textarea id="bookingDescription" class="form-textarea" placeholder="Provide a brief note regarding your appointment, underlying symptoms, or relevant operational history..."></textarea>
            </div>

            <button type="button" class="confirm-btn" id="submitBookingBtn" disabled>
                <i class="fa-solid fa-calendar-check"></i> Complete Secure Booking
            </button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const SUPABASE_BASE_URL = "https://ylganbeyiuikbxmtsdha.supabase.co";
            const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlsZ2FuYmV5aXVpa2J4bXRzZGhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNzAxNzUsImV4cCI6MjA5NTg0NjE3NX0.S0gUc-w_EwiFPVkqLsUFOfa4A7su8na6kCk9j7eI3-8";
            
            const token = localStorage.getItem("user_token");
            const email = localStorage.getItem("user_email");
            const cachedName = localStorage.getItem("user_name") || "Patient Member";

            if (!token || !email) {
                alert("Access Denied: Please sign in to log a request.");
                window.location.href = "login.html";
                return;
            }

            document.body.style.display = "flex";

            // Mobile menu toggling
            document.getElementById("menuToggle").addEventListener("click", function() {
                this.classList.toggle("open");
                document.getElementById("navMenu").classList.toggle("open");
            });

            generateYearCalendar(2026);

            function generateTimeSlotsList() {
                const slots = [];
                for (let hour = 8; hour <= 20; hour++) {
                    for (let min = 0; min < 60; min += 15) {
                        const hStr = hour.toString().padStart(2, '0');
                        const mStr = min.toString().padStart(2, '0');
                        slots.push(`${hStr}:${mStr}`);
                        if (hour === 20) break; 
                    }
                }
                return slots;
            }

            function showToast(message, isSuccess) {
                const toast = document.getElementById("notificationToast");
                toast.className = isSuccess ? "success" : "error";
                toast.innerHTML = isSuccess ? `<i class="fa-solid fa-circle-check"></i> ${message}` : `<i class="fa-solid fa-circle-exclamation"></i> ${message}`;
                toast.style.display = "flex";
                window.scrollTo({ top: 0, behavior: 'smooth' });
                setTimeout(() => { toast.style.display = "none"; }, 5000);
            }

            function generateYearCalendar(year) {
                const grid = document.getElementById("calendarYearGrid");
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                const weekdays = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];

                months.forEach((month, index) => {
                    const card = document.createElement("div");
                    card.className = "month-card";

                    const title = document.createElement("div");
                    title.className = "month-title";
                    title.textContent = month;
                    card.appendChild(title);

                    const weekdaysRow = document.createElement("div");
                    weekdaysRow.className = "weekdays-grid";
                    weekdays.forEach(d => { weekdaysRow.appendChild(document.createElement("div")).textContent = d; });
                    card.appendChild(weekdaysRow);

                    const daysGrid = document.createElement("div");
                    daysGrid.className = "days-grid";

                    const firstDayIndex = new Date(year, index, 1).getDay();
                    const totalDays = new Date(year, index + 1, 0).getDate();

                    for (let i = 0; i < firstDayIndex; i++) {
                        const emptyCell = document.createElement("div");
                        emptyCell.className = "day-cell empty";
                        daysGrid.appendChild(emptyCell);
                    }

                    for (let day = 1; day <= totalDays; day++) {
                        const dayCell = document.createElement("div");
                        dayCell.className = "day-cell";
                        dayCell.textContent = day;

                        dayCell.addEventListener("click", () => {
                            const isoDate = `${year}-${(index + 1).toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;
                            openBookingModal(isoDate);
                        });

                        daysGrid.appendChild(dayCell);
                    }
                    card.appendChild(daysGrid);
                    grid.appendChild(card);
                });
            }

            let selectedDateString = null;
            let selectedTimeString = null;

            async function openBookingModal(dateString) {
                selectedDateString = dateString;
                selectedTimeString = null;
                
                document.getElementById("modalTargetDate").textContent = `Schedule: ${dateString}`;
                document.getElementById("bookingDescription").value = ""; // Clear notes value out from last modal load instance
                const slotsGrid = document.getElementById("slotsGrid");
                const submitBtn = document.getElementById("submitBookingBtn");
                
                slotsGrid.innerHTML = `<p style="grid-column: 1/-1; text-align:center;">Checking real-time availability...</p>`;
                submitBtn.disabled = true;
                document.getElementById("bookingModal").style.display = "flex";

                let bookedSlots = [];
                try {
                    const response = await fetch(`${SUPABASE_BASE_URL}/rest/v1/appointments?date=eq.${dateString}&select=time`, {
                        method: "GET",
                        headers: { "apikey": ANON_KEY, "Authorization": `Bearer ${token}` }
                    });
                    if (response.ok) {
                        const data = await response.json();
                        bookedSlots = data.map(item => item.time.substring(0, 5)); 
                    }
                } catch (err) {
                    console.error("Error checking availability configuration states:", err);
                }

                slotsGrid.innerHTML = "";
                const absoluteSlotsList = generateTimeSlotsList();

                absoluteSlotsList.forEach(time => {
                    const slotNode = document.createElement("div");
                    slotNode.className = "time-slot";
                    slotNode.textContent = time;

                    if (bookedSlots.includes(time)) {
                        slotNode.classList.add("booked");
                        slotNode.title = "This slot is already reserved.";
                    } else {
                        slotNode.classList.add("available");
                        slotNode.addEventListener("click", () => {
                            document.querySelectorAll(".time-slot.selected").forEach(el => el.classList.remove("selected"));
                            slotNode.classList.add("selected");
                            selectedTimeString = time;
                            submitBtn.disabled = false;
                        });
                    }
                    slotsGrid.appendChild(slotNode);
                });
            }

            document.getElementById("modalCloseBtn").addEventListener("click", () => {
                document.getElementById("bookingModal").style.display = "none";
            });

            document.getElementById("submitBookingBtn").addEventListener("click", async () => {
                if (!selectedDateString || !selectedTimeString) return;

                const submitBtn = document.getElementById("submitBookingBtn");
                const descriptionText = document.getElementById("bookingDescription").value.trim();

                submitBtn.disabled = true;
                submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Finalizing Slot...`;

                try {
                    const response = await fetch(`${SUPABASE_BASE_URL}/rest/v1/appointments`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "apikey": ANON_KEY,
                            "Authorization": `Bearer ${token}`,
                            "Prefer": "return=minimal"
                        },
                        body: JSON.stringify({
                            date: selectedDateString,
                            time: selectedTimeString,
                            user_name: cachedName,
                            user_email: email,
                            description: descriptionText || null // Deliver description mapping parameter string payload
                        })
                    });

                    if (response.ok) {
                        document.getElementById("bookingModal").style.display = "none";
                        showToast(`Appointment successfully confirmed for ${selectedDateString} at ${selectedTimeString}!`, true);
                    } else {
                        const errorDetails = await response.json();
                        if (response.status === 409 || (errorDetails.message && errorDetails.message.includes("unique"))) {
                            showToast("Booking Conflict: This exact time slot was just claimed by another user. Please select a different time.", false);
                        } else {
                            showToast("Reservation Failed: " + (errorDetails.message || response.statusText), false);
                        }
                    }
                } catch (err) {
                    showToast("Pipeline connection interface failure: " + err.message, false);
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<i class="fa-solid fa-calendar-check"></i> Complete Secure Booking`;
                }
            });

            document.getElementById("logoutBtn").addEventListener("click", () => {
                localStorage.clear();
                window.location.href = "login.html";
            });
        });
    </script>
</body>
</html>
